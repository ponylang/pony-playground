name: Daily Smoke Test

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify playground.ponylang.io
    runs-on: ubuntu-latest
    steps:
      - name: Test evaluate (Run button)
        run: |
          set -euo pipefail
          curl -s -f -X POST \
            https://playground.ponylang.io/evaluate.json \
            -H 'Content-Type: application/json' \
            -d '{"code":"actor Main\n  new create(env: Env) =>\n    env.out.print(\"hello world\")"}' \
            -o response.json

          success=$(jq -r '.success' response.json)
          stdout=$(jq -r '.stdout' response.json)

          if [ "$success" != "true" ]; then
            echo "::error::Evaluate did not succeed"
            jq . response.json
            exit 1
          fi

          if [[ "$stdout" != *"hello world"* ]]; then
            echo "::error::Evaluate stdout missing expected output"
            jq . response.json
            exit 1
          fi

          echo "Evaluate: OK"

      - name: Test compile LLVM IR
        run: |
          set -euo pipefail
          curl -s -f -X POST \
            https://playground.ponylang.io/compile.json \
            -H 'Content-Type: application/json' \
            -d '{"emit":"llvm-ir","code":"actor Main\n  new create(env: Env) => None"}' \
            -o response.json

          if jq -e '.error' response.json > /dev/null 2>&1; then
            echo "::error::LLVM IR compile returned an error"
            jq . response.json
            exit 1
          fi

          result=$(jq -r '.result // empty' response.json)
          if [[ "$result" != *"ModuleID"* ]]; then
            echo "::error::LLVM IR output missing ModuleID"
            exit 1
          fi

          echo "LLVM IR: OK"

      - name: Test compile ASM
        run: |
          set -euo pipefail
          curl -s -f -X POST \
            https://playground.ponylang.io/compile.json \
            -H 'Content-Type: application/json' \
            -d '{"emit":"asm","code":"actor Main\n  new create(env: Env) => None"}' \
            -o response.json

          if jq -e '.error' response.json > /dev/null 2>&1; then
            echo "::error::ASM compile returned an error"
            jq . response.json
            exit 1
          fi

          result=$(jq -r '.result // empty' response.json)
          if [[ "$result" != *"Disassembly"* ]]; then
            echo "::error::ASM output missing disassembly header"
            exit 1
          fi

          echo "ASM: OK"
