name: PR

on: pull_request

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Lint markdown
        uses: docker://ghcr.io/ponylang/shared-docker-ci-markdownlint:20260810

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Lint shell scripts
        uses: docker://ghcr.io/ponylang/shared-docker-ci-shellcheck:20260810

  cargo-checks:
    name: Cargo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: setup rust toolchain
        run: rustup show
      - name: install rust toolchain components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all
      - name: Cargo test
        run: cargo test --all -- --nocapture

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: setup rust toolchain
        run: rustup show
      - name: build docker image
        run: docker build docker -t ponylang-playpen
      - name: Integration tests
        run: cargo test --test api -- --ignored --nocapture
